name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: milkshake
          POSTGRES_PASSWORD: milkshake
          POSTGRES_DB: milkshake
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U milkshake"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_USER: milkshake
      POSTGRES_PASSWORD: milkshake
      POSTGRES_DB: milkshake
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: "5432"
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check app tests
      - name: Migrations apply from empty and roll back
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Tests
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=75

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type and a11y check
        run: npm run check
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          cp .env.example .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" .env
          docker compose up -d --build
          docker compose exec -T backend sh -c "until alembic upgrade head; do sleep 2; done"
          docker compose exec -T backend python -m app.scripts.seed_data
          timeout 180 sh -c "until curl -sf http://localhost:5173/ >/dev/null; do sleep 3; done"
      - name: Accessibility, keyboard and i18n tests
        run: |
          docker run --rm --ipc=host --network milkshake_default             -e BASE_URL=http://frontend:5173             -v "$PWD/web:/app" -w /app             mcr.microsoft.com/playwright:v1.49.1-jammy             sh -c "npm ci && npx playwright test"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 100
